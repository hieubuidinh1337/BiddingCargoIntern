<!DOCTYPE html>
<html>
<head>
    <title>Test Setup</title>
    <script src="/assets/js/cargo-store.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100;0,200;0,300;0,400;0,500;0,531;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,531;1,600;1,700;1,800;1,900" rel="stylesheet" />
    <style>
        body, input, select, textarea, button {
            font-family: 'Exo', sans-serif;
        }
    </style>
</head>
<body>
    <h1>Setting up test data...</h1>
    <script>
        setTimeout(() => {
            const wonId = 'WA-TEST-' + Date.now();
            const wonAuction = {
                wonId: wonId,
                auctionId: Date.now(),
                flightCode: 'FL-TEST-CANCEL',
                route: 'SGN - HAN',
                etd: new Date(Date.now() + 86400000).toISOString(),
                capacityKg: 1000,
                wonPriceKg: 20000,
                totalValue: 20000000,
                agentCode: 'AG-0892',
                agentName: 'ABC Logistics',
                wonAt: new Date().toISOString(),
                paymentStatus: 'PAID',
                status: 'WON'
            };
            
            if (!CargoStore.data.wonAuctions) {
                CargoStore.data.wonAuctions = [];
            }
            CargoStore.data.wonAuctions.unshift(wonAuction);
            CargoStore.saveToStorage();
            
            CargoStore.cancelAuction(wonAuction.auctionId, 'Admin decided to cancel due to weather');
            
            CargoStore.loginAgent('AG-0892', 'abc123456');
            
            document.body.innerHTML += '<p>Setup complete. Redirecting...</p>';
            
            setTimeout(() => {
                window.location.href = '07-WonAuction.html';
            }, 1000);
        }, 1000);
    </script>
</body>
</html>
